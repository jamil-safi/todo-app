server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster load times
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Serve static assets directly, with long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy ALL API requests to the Django backend container.
    # "backend" resolves via Docker's internal network (the service name
    # in docker-compose.prod.yml) — not reachable from outside Docker.
    # Since every DRF route now lives under /api/ (see urls.py), this
    # single rule covers auth, todos, and any future endpoints — no
    # per-route additions needed here again.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin panel — separate from /api/, still needs its own proxy
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's own CSS/JS (served by whitenoise under STATIC_URL)
    # Distinct from /assets/ above, which is the React build's own output
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # React Router (client-side routing) fallback:
    # any unmatched path falls back to index.html so React can handle routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NEVER be cached — it references the hashed JS/CSS
    # filenames, so a stale cached index.html means the browser silently
    # keeps loading an old build even after you deploy a new one.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}