name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # ============================================
  # 1. Run backend tests before anything else.
  #    If this fails, the pipeline stops here —
  #    nothing gets built or deployed.
  # ============================================
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "False"
          COOKIE_SECURE: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          FRONTEND_URL: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
        run: pytest

  # ============================================
  # 2. Build both images and push to Docker Hub,
  #    tagged with the commit SHA — never "latest"
  #    — so every deploy is traceable and every
  #    previous version stays pullable for rollback.
  #    Only runs if tests passed.
  # ============================================
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}

  # ============================================
  # 3. SSH into EC2, update the compose file to
  #    point at the new commit-SHA-tagged images,
  #    pull, and recreate the containers.
  # ============================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/todo-app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/todo-app
            sed -i "s|todo-backend:.*|todo-backend:${{ github.sha }}|" docker-compose.prod.yml
            sed -i "s|todo-frontend:.*|todo-frontend:${{ github.sha }}|" docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
